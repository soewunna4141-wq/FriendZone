name: Build Debug APK and Run UI Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Make sure Gradle is available
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 30
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace --info --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendZone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
